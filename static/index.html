<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe App - AI Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-bg { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(209, 213, 219, 0.3);
        }
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Token management
        const getToken = () => localStorage.getItem('token');
        const setToken = (token) => localStorage.setItem('token', token);
        const removeToken = () => localStorage.removeItem('token');

        // API calls
        const api = {
            async register(username, email, password) {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                return response.json();
            },
            
            async login(username, password) {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                return response.json();
            },
            
            async getMe() {
                const response = await fetch('/api/me', {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                return response.json();
            },
            
            async generateImage(prompt, model = 'qwen-image-2-pro') {
                const response = await fetch('/api/generate-image', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ prompt, model })
                });
                return response.json();
            },
            
            async generateTTS(text, voice = 'af_nicole') {
                const response = await fetch('/api/generate-tts', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ text, voice })
                });
                return response.json();
            },
            
            async getHistory() {
                const response = await fetch('/api/history', {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                return response.json();
            }
        };

        // Login Component
        function LoginForm({ onLogin, mode, setMode }) {
            const [formData, setFormData] = useState({ username: '', email: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    let result;
                    if (mode === 'login') {
                        result = await api.login(formData.username, formData.password);
                    } else {
                        result = await api.register(formData.username, formData.email, formData.password);
                    }

                    if (result.access_token) {
                        setToken(result.access_token);
                        onLogin();
                    } else {
                        setError(result.detail || 'Authentication failed');
                    }
                } catch (err) {
                    setError('Network error. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                    <div className="card rounded-xl p-8 w-full max-w-md">
                        <h2 className="text-3xl font-bold text-center mb-6 text-gray-800">
                            {mode === 'login' ? 'Welcome Back' : 'Join Vibe App'}
                        </h2>
                        
                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input
                                type="text"
                                placeholder="Username"
                                value={formData.username}
                                onChange={(e) => setFormData({...formData, username: e.target.value})}
                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                required
                            />
                            
                            {mode === 'register' && (
                                <input
                                    type="email"
                                    placeholder="Email"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required
                                />
                            )}
                            
                            <input
                                type="password"
                                placeholder="Password"
                                value={formData.password}
                                onChange={(e) => setFormData({...formData, password: e.target.value})}
                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                required
                            />

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Please wait...' : mode === 'login' ? 'Sign In' : 'Create Account'}
                            </button>
                        </form>

                        <p className="text-center mt-4 text-gray-600">
                            {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
                            <button
                                onClick={() => setMode(mode === 'login' ? 'register' : 'login')}
                                className="text-blue-600 hover:underline"
                            >
                                {mode === 'login' ? 'Sign up' : 'Sign in'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        }

        // Dashboard Component
        function Dashboard({ user, onLogout }) {
            const [activeTab, setActiveTab] = useState('generate');
            const [imagePrompt, setImagePrompt] = useState('');
            const [ttsText, setTtsText] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [history, setHistory] = useState([]);
            const audioRef = useRef();

            useEffect(() => {
                if (activeTab === 'history') {
                    loadHistory();
                }
            }, [activeTab]);

            const loadHistory = async () => {
                try {
                    const historyData = await api.getHistory();
                    setHistory(historyData);
                } catch (error) {
                    console.error('Failed to load history:', error);
                }
            };

            const handleImageGenerate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setResult(null);

                try {
                    const response = await api.generateImage(imagePrompt);
                    setResult(response);
                    setImagePrompt('');
                } catch (error) {
                    console.error('Image generation failed:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleTTSGenerate = async (e) => {
                e.preventDefault();
                setLoading(true);
                setResult(null);

                try {
                    const response = await api.generateTTS(ttsText);
                    setResult(response);
                    setTtsText('');
                } catch (error) {
                    console.error('TTS generation failed:', error);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <h1 className="text-2xl font-bold text-gray-900">Vibe App</h1>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <span className="text-gray-600">Welcome, {user.username}</span>
                                    <button
                                        onClick={onLogout}
                                        className="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Tabs */}
                        <div className="flex space-x-1 bg-gray-100 p-1 rounded-lg mb-8 w-fit">
                            <button
                                onClick={() => setActiveTab('generate')}
                                className={`px-4 py-2 rounded-md transition-colors ${
                                    activeTab === 'generate' ? 'bg-white shadow text-blue-600' : 'text-gray-600 hover:text-gray-900'
                                }`}
                            >
                                Generate AI Content
                            </button>
                            <button
                                onClick={() => setActiveTab('history')}
                                className={`px-4 py-2 rounded-md transition-colors ${
                                    activeTab === 'history' ? 'bg-white shadow text-blue-600' : 'text-gray-600 hover:text-gray-900'
                                }`}
                            >
                                History
                            </button>
                        </div>

                        {activeTab === 'generate' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                {/* Image Generation */}
                                <div className="bg-white rounded-lg shadow p-6">
                                    <h2 className="text-xl font-semibold mb-4">🎨 Image Generation</h2>
                                    <form onSubmit={handleImageGenerate} className="space-y-4">
                                        <textarea
                                            placeholder="Describe the image you want to generate..."
                                            value={imagePrompt}
                                            onChange={(e) => setImagePrompt(e.target.value)}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent h-24 resize-none"
                                            required
                                        />
                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                        >
                                            {loading ? 'Generating...' : 'Generate Image'}
                                        </button>
                                    </form>
                                </div>

                                {/* TTS Generation */}
                                <div className="bg-white rounded-lg shadow p-6">
                                    <h2 className="text-xl font-semibold mb-4">🎤 Text-to-Speech</h2>
                                    <form onSubmit={handleTTSGenerate} className="space-y-4">
                                        <textarea
                                            placeholder="Enter text to convert to speech..."
                                            value={ttsText}
                                            onChange={(e) => setTtsText(e.target.value)}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent h-24 resize-none"
                                            required
                                        />
                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 disabled:opacity-50"
                                        >
                                            {loading ? 'Generating...' : 'Generate Speech'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Results */}
                        {result && (
                            <div className="mt-8 bg-white rounded-lg shadow p-6">
                                <h3 className="text-lg font-semibold mb-4">✨ Generated Content</h3>
                                {result.image_url && (
                                    <div>
                                        <img
                                            src={result.image_url}
                                            alt={result.prompt}
                                            className="max-w-full h-auto rounded-lg shadow"
                                        />
                                        <p className="mt-2 text-gray-600">{result.prompt}</p>
                                    </div>
                                )}
                                {result.audio_url && (
                                    <div>
                                        <audio
                                            ref={audioRef}
                                            controls
                                            src={result.audio_url}
                                            className="w-full"
                                        />
                                        <p className="mt-2 text-gray-600">{result.text}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* History Tab */}
                        {activeTab === 'history' && (
                            <div className="bg-white rounded-lg shadow">
                                <div className="p-6 border-b">
                                    <h2 className="text-xl font-semibold">📚 Generation History</h2>
                                </div>
                                <div className="divide-y">
                                    {history.length === 0 ? (
                                        <div className="p-6 text-center text-gray-500">
                                            No generations yet. Try creating some AI content!
                                        </div>
                                    ) : (
                                        history.map((item) => (
                                            <div key={item.id} className="p-6 hover:bg-gray-50">
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className={`px-2 py-1 text-xs rounded-full ${
                                                        item.type === 'image' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'
                                                    }`}>
                                                        {item.type === 'image' ? '🎨 Image' : '🎤 TTS'}
                                                    </span>
                                                    <span className="text-sm text-gray-500">
                                                        {new Date(item.created_at).toLocaleDateString()}
                                                    </span>
                                                </div>
                                                <p className="text-gray-700 mb-2">{item.prompt}</p>
                                                {item.result_url && (
                                                    <div className="mt-2">
                                                        {item.type === 'image' ? (
                                                            <img
                                                                src={item.result_url}
                                                                alt={item.prompt}
                                                                className="max-w-xs h-auto rounded border"
                                                            />
                                                        ) : (
                                                            <audio controls src={item.result_url} className="w-full max-w-md" />
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [user, setUser] = useState(null);
            const [authMode, setAuthMode] = useState('login');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                checkAuth();
            }, []);

            const checkAuth = async () => {
                const token = getToken();
                if (token) {
                    try {
                        const userData = await api.getMe();
                        setUser(userData);
                        setIsAuthenticated(true);
                    } catch (error) {
                        removeToken();
                        setIsAuthenticated(false);
                    }
                }
                setLoading(false);
            };

            const handleLogin = () => {
                checkAuth();
            };

            const handleLogout = () => {
                removeToken();
                setIsAuthenticated(false);
                setUser(null);
            };

            if (loading) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center">
                        <div className="loading text-white text-xl">Loading...</div>
                    </div>
                );
            }

            return isAuthenticated ? (
                <Dashboard user={user} onLogout={handleLogout} />
            ) : (
                <LoginForm onLogin={handleLogin} mode={authMode} setMode={setAuthMode} />
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
