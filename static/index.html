<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>TikTok Vibe App - Akari Content Generator</title>\n    <script src=\"https://unpkg.com/react@18/umd/react.production.min.js\"></script>\n    <script src=\"https://unpkg.com/react-dom@18/umd/react-dom.production.min.js\"></script>\n    <script src=\"https://unpkg.com/@babel/standalone/babel.min.js\"></script>\n    <script src=\"https://cdn.tailwindcss.com\"></script>\n    <style>\n        .gradient-bg {\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n        }\n        .glass {\n            background: rgba(255, 255, 255, 0.1);\n            backdrop-filter: blur(10px);\n            border: 1px solid rgba(255, 255, 255, 0.2);\n        }\n    </style>\n</head>\n<body class=\"gradient-bg min-h-screen\">\n    <div id=\"root\"></div>\n\n    <script type=\"text/babel\">\n        const { useState, useEffect } = React;\n\n        function App() {\n            const [status, setStatus] = useState(null);\n            const [loading, setLoading] = useState(false);\n            const [content, setContent] = useState(null);\n            const [theme, setTheme] = useState('lifestyle');\n            const [style, setStyle] = useState('glamorous');\n\n            // Check API status on load\n            useEffect(() => {\n                fetch('/health')\n                    .then(res => res.json())\n                    .then(data => setStatus(data))\n                    .catch(err => console.error('Health check failed:', err));\n            }, []);\n\n            const themes = [\n                { value: 'lifestyle', label: '✨ Lifestyle', desc: 'Luxurious everyday moments' },\n                { value: 'fashion', label: '👗 Fashion', desc: 'Trendy outfits & style' },\n                { value: 'beauty', label: '💄 Beauty', desc: 'Makeup & skincare vibes' },\n                { value: 'luxury', label: '💎 Luxury', desc: 'High-end sophistication' }\n            ];\n\n            const generateContent = async () => {\n                setLoading(true);\n                setContent(null);\n\n                try {\n                    const response = await fetch('/api/tiktok-content', {\n                        method: 'POST',\n                        headers: { 'Content-Type': 'application/json' },\n                        body: JSON.stringify({ theme, style })\n                    });\n\n                    if (response.ok) {\n                        const result = await response.json();\n                        setContent(result);\n                    } else {\n                        const error = await response.json();\n                        alert(`Error: ${error.detail || 'Generation failed'}`);\n                    }\n                } catch (err) {\n                    alert(`Network error: ${err.message}`);\n                } finally {\n                    setLoading(false);\n                }\n            };\n\n            return (\n                <div className=\"min-h-screen p-4\">\n                    <div className=\"max-w-4xl mx-auto\">\n                        {/* Header */}\n                        <div className=\"glass rounded-2xl p-6 mb-6\">\n                            <h1 className=\"text-3xl font-bold text-white text-center mb-2\">\n                                🚀 TikTok Vibe App\n                            </h1>\n                            <p className=\"text-white/80 text-center\">\n                                AI-Powered Content Generator for @meetAkari\n                            </p>\n                            \n                            {status && (\n                                <div className=\"mt-4 p-3 bg-white/10 rounded-lg\">\n                                    <div className=\"flex items-center justify-between text-sm text-white/90\">\n                                        <span>Status: {status.status}</span>\n                                        <span>Venice AI: {status.venice_api}</span>\n                                    </div>\n                                </div>\n                            )}\n                        </div>\n\n                        <div className=\"grid md:grid-cols-2 gap-6\">\n                            {/* Content Generator */}\n                            <div className=\"glass rounded-2xl p-6\">\n                                <h2 className=\"text-xl font-semibold text-white mb-4\">\n                                    🎨 Generate Content\n                                </h2>\n\n                                {/* Theme Selection */}\n                                <div className=\"mb-4\">\n                                    <label className=\"block text-white/90 mb-2 font-medium\">\n                                        Theme\n                                    </label>\n                                    <div className=\"grid grid-cols-2 gap-2\">\n                                        {themes.map(t => (\n                                            <button\n                                                key={t.value}\n                                                onClick={() => setTheme(t.value)}\n                                                className={`p-3 rounded-lg transition-all ${\n                                                    theme === t.value\n                                                        ? 'bg-purple-500 text-white'\n                                                        : 'bg-white/10 text-white/80 hover:bg-white/20'\n                                                }`}\n                                            >\n                                                <div className=\"font-medium\">{t.label}</div>\n                                                <div className=\"text-xs opacity-80\">{t.desc}</div>\n                                            </button>\n                                        ))}\n                                    </div>\n                                </div>\n\n                                {/* Style Selection */}\n                                <div className=\"mb-6\">\n                                    <label className=\"block text-white/90 mb-2 font-medium\">\n                                        Style\n                                    </label>\n                                    <select \n                                        value={style} \n                                        onChange={e => setStyle(e.target.value)}\n                                        className=\"w-full p-3 rounded-lg bg-white/10 text-white border border-white/20\"\n                                    >\n                                        <option value=\"glamorous\">✨ Glamorous</option>\n                                        <option value=\"casual\">👕 Casual</option>\n                                        <option value=\"elegant\">👑 Elegant</option>\n                                        <option value=\"trendy\">🔥 Trendy</option>\n                                    </select>\n                                </div>\n\n                                {/* Generate Button */}\n                                <button\n                                    onClick={generateContent}\n                                    disabled={loading}\n                                    className=\"w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all disabled:opacity-50\"\n                                >\n                                    {loading ? (\n                                        <span className=\"flex items-center justify-center\">\n                                            <svg className=\"animate-spin -ml-1 mr-3 h-5 w-5 text-white\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\">\n                                                <circle className=\"opacity-25\" cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" strokeWidth=\"4\"></circle>\n                                                <path className=\"opacity-75\" fill=\"currentColor\" d=\"M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z\"></path>\n                                            </svg>\n                                            Generating...\n                                        </span>\n                                    ) : (\n                                        '🚀 Generate Content'\n                                    )}\n                                </button>\n                            </div>\n\n                            {/* Results */}\n                            <div className=\"glass rounded-2xl p-6\">\n                                <h2 className=\"text-xl font-semibold text-white mb-4\">\n                                    📱 Generated Content\n                                </h2>\n\n                                {loading && (\n                                    <div className=\"text-center py-8\">\n                                        <div className=\"text-white/60\">Generating Akari content...</div>\n                                        <div className=\"text-sm text-white/40 mt-2\">This may take up to 30 seconds</div>\n                                    </div>\n                                )}\n\n                                {content && (\n                                    <div className=\"space-y-4\">\n                                        {/* Image */}\n                                        {content.content?.image_b64 && (\n                                            <div className=\"bg-white/10 rounded-lg p-4\">\n                                                <div className=\"text-white/90 font-medium mb-2\">🖼️ Generated Image</div>\n                                                <img \n                                                    src={`data:image/png;base64,${content.content.image_b64}`}\n                                                    alt=\"Generated Akari content\"\n                                                    className=\"w-full max-w-xs mx-auto rounded-lg shadow-lg\"\n                                                />\n                                            </div>\n                                        )}\n\n                                        {/* Caption */}\n                                        {content.content?.caption && (\n                                            <div className=\"bg-white/10 rounded-lg p-4\">\n                                                <div className=\"text-white/90 font-medium mb-2\">📝 Caption</div>\n                                                <p className=\"text-white/80\">{content.content.caption}</p>\n                                            </div>\n                                        )}\n\n                                        {/* Hashtags */}\n                                        {content.content?.hashtags && (\n                                            <div className=\"bg-white/10 rounded-lg p-4\">\n                                                <div className=\"text-white/90 font-medium mb-2\">🏷️ Hashtags</div>\n                                                <p className=\"text-white/80 text-sm\">{content.content.hashtags}</p>\n                                            </div>\n                                        )}\n\n                                        {/* Metadata */}\n                                        <div className=\"bg-white/10 rounded-lg p-4\">\n                                            <div className=\"text-white/90 font-medium mb-2\">ℹ️ Details</div>\n                                            <div className=\"text-white/60 text-sm space-y-1\">\n                                                <div>Theme: {content.content?.theme}</div>\n                                                <div>Account: @{content.content?.account}</div>\n                                                <div>Generated: {content.metadata?.timestamp && new Date(content.metadata.timestamp).toLocaleTimeString()}</div>\n                                            </div>\n                                        </div>\n                                    </div>\n                                )}\n\n                                {!loading && !content && (\n                                    <div className=\"text-center py-8 text-white/60\">\n                                        Select a theme and click generate to create content\n                                    </div>\n                                )}\n                            </div>\n                        </div>\n\n                        {/* Footer */}\n                        <div className=\"glass rounded-2xl p-4 mt-6 text-center\">\n                            <p className=\"text-white/60 text-sm\">\n                                Powered by Venice AI • Made for @meetAkari\n                            </p>\n                        </div>\n                    </div>\n                </div>\n            );\n        }\n\n        ReactDOM.render(<App />, document.getElementById('root'));\n    </script>\n</body>\n</html>"
